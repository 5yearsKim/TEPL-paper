title: TEPL architecture
concept: Rule, Dialect, and Graph are the three user-facing inputs; rules and dialects compile into programs that engines apply to the graph.
purpose: Make the three inputs the visual entry points, explain their distinct roles, and show the extension point for additional engines.
requirements:
  - 'Apply the shared axis-group UI in tools/figure_style.md: canonical bordered chips, inline group colors, underscore notation, and contextual dimming. Preserve this figure''s content and frame dimensions.'
  - Follow tools/figure_style.md; target a half-width frame of 500 px, approximately 820 px tall.
  - Use bold 24 px headings for Rule, Dialect, and Graph, 22 px section headings, and 18 px labels; increase height if needed rather than shrinking text.
  - Make Rule, Dialect, and Graph equally prominent cards across the top, with the same dimensions, heading weight, and blue outline.
  - Place the compiler and compiled artifact below Rule and Dialect; reserve a clear right-side lane from Graph directly to the engine.
  - Use blue for all three input cards, green for compiler stages and generated programs, and neutral fills for engines and the output graph.
  - Keep compiler internals visually subordinate to the three inputs, using lighter outlines and regular-weight labels.
  - Use commas, plus signs, or line breaks as separators; do not use middle dots.
  - Use solid arrows for implemented dataflow; use a dashed box and dashed connector for the additional-engine extension.
  - Show a visible compilation/runtime boundary below the compiled artifact.
  - Keep the figure architectural; omit implementation languages, parser libraries, and detailed inference algorithms.
  - Users supply operation definitions and semantics, not Axes IR; the compiler performs semantic lowering and composition.
  - Runtime evaluates compiled attribute programs on matched metadata; synthesis and semantic verification happen during compilation.
  - The additional engine is an extension target through an adapter; e-graph is an example of a possible target, not an implemented integration.

children:
  - name: inputs
    type: image
    pos: [0.03, 0.97, 0.02, 0.20]
    requirements:
      - Draw the three cards defined below in one row; align their headings and top and bottom edges.
      - Give each card a pale blue fill and enough padding to separate its heading from its contents.
      - Connect Rule and Dialect to the compiler frontend with solid downward arrows.
      - Connect Graph directly to the TEPL engine through the right-side lane, bypassing compilation.
    children:
      - name: rule
        type: text
        pos: [0.00, 0.32, 0.00, 1.00]
        content: |-
          Rule
          Patterns
          Guards
          Attributes / auto

      - name: dialect
        type: text
        pos: [0.34, 0.66, 0.00, 1.00]
        content: |-
          Dialect
          Operations
          Semantics

      - name: graph
        type: image
        pos: [0.68, 1.00, 0.00, 1.00]
        requirements:
          - Use the exact heading "Graph" with the same prominence as Rule and Dialect.
          - Below the heading, draw a small node-link glyph representing a tensor computation graph.
          - This is the user-provided input graph, not an intermediate compiler representation.

  - name: compiler
    type: image
    pos: [0.03, 0.73, 0.25, 0.55]
    requirements:
      - Draw one lightly tinted enclosure grouping the compiler stages.
      - Connect frontend downward to semantic_representations; lowering and composition produce Axes IR.
      - Connect semantic_representations downward to synthesis_and_verification.
      - Export only completed, accepted rules from synthesis_and_verification to compiled_rules.
    children:
      - name: compiler_heading
        type: text
        pos: [0.04, 0.96, 0.02, 0.15]
        content: TEPL compiler

      - name: frontend
        type: text
        pos: [0.06, 0.94, 0.21, 0.35]
        content: Parse + resolve + type-check

      - name: semantic_representations
        type: image
        pos: [0.06, 0.94, 0.45, 0.62]
        requirements:
          - Draw two small representation boxes connected left to right.
          - Label them "Axes IR" and "Normalized terms".

      - name: synthesis_and_verification
        type: image
        pos: [0.06, 0.94, 0.75, 0.94]
        requirements:
          - Draw two stage boxes connected left to right.
          - Label them "Synthesize attributes" and "Verify rule"; wrap the first label onto two lines if needed.
          - Verification checks the completed rule, including explicit or synthesized attributes.

  - name: compiled_rules
    type: image
    pos: [0.03, 0.73, 0.59, 0.70]
    requirements:
      - Draw a green document-shaped artifact headed "Compiled rules (JSON)".
      - 'Show its contents on two lines: "LHS / RHS, guard" and "Attribute program".'
      - Do not show raw JSON syntax.
      - This is a reusable program, not attributes computed for one concrete graph.

  - name: phase_boundary
    type: image
    pos: [0.02, 0.98, 0.72, 0.73]
    requirements:
      - Draw a thin horizontal divider; keep engine connectors visible across it.

  - name: rewrite_execution
    type: image
    pos: [0.02, 0.98, 0.75, 0.99]
    requirements:
      - Place the heading "Rewrite execution" at the top of this band.
      - Draw a solid TEPL engine box on the left, aligned with the compiler and compiled artifact, and a small output graph on its right.
      - Receive the input-graph connector from the top Graph card at the engine's upper-right edge; do not duplicate the input graph here.
      - Keep the graph-input connector above the engine-to-output arrow so that the two paths do not cross.
      - Label the output glyph "Output graph", wrapping onto two lines, and connect it from the engine with a solid arrow.
      - Inside the engine show "TEPL engine" and a compact clockwise loop with Match and Guard on the top row, and Rewrite and Attributes on the bottom row.
      - Connect Match → Guard → Attributes → Rewrite → Match with arrows; the return to Match indicates greedy repetition.
      - The Attributes step evaluates the compiled attribute program using the current match.
      - Below the TEPL engine, draw a dashed box headed "Additional engine …" with the second line "e.g., e-graph".
      - Allow enough height for both lines at 18 px or larger; increase the runtime band's height if needed.
      - Connect compiled_rules to the TEPL engine with a solid arrow.
      - Route the compiled-rule connector to the right of the runtime heading so that it does not cross text.
      - Branch a dashed connector from compiled_rules to the additional engine, labeled "Adapter".
      - Route the extension connector along the left margin; keep it clear of the Graph bypass lane and engine loop.
      - The graph path illustrates TEPL execution; the additional engine is a separate consumer of compiled rules.
