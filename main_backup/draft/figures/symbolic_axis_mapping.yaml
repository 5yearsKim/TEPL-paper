title: Symbolic Axis Mapping
concept: Connect nested operations' local axis descriptions through their shared tensor, yielding one consistent
  mapping for the composed semantic expression.
purpose: Show how addition's whole-axis group S is aligned with the dot output I ++ J, enabling algebraic reasoning
  over aligned operand reads.
requirements:
- 'Apply the shared axis-group UI in tools/figure_style.md: canonical bordered chips, inline group colors, underscore notation, and contextual dimming. Preserve this figure''s content and frame dimensions.'
- Follow tools/figure_style.md. Use an exact half-width 500 × 800 px editable frame, maxWidth 500, with 16 px outer
  margins and 6 px vertical gaps. Reflow the previous comparison vertically; preserve every mapping entry.
- Use unbatched matrix dot and elementwise addition without broadcasting. Each of I, K, J contains one axis in the
  concrete example; their lengths remain symbolic in the expressions.
- Show the semantic expression once, with Dot scope visibly nested inside Addition scope. Use labeled blue dot and amber addition accents with neutral scope bodies and outlines. Mapping
  changes coordinate descriptions, not values or physical axis order. The transition explicitly states that the
  expression stays the same.
- Blue (#5479A8), amber (#D4A65C), and green (#6A9F88) identify labeled dot, addition, and shared-scope accents. Axis groups retain the shared style's origin colors; keep other mathematical text dark.
- Use a 62 px example header, 78 px nested-scope expression, 210 px local-mapping section, 50 px mapping transition,
  262 px shared table, and 74 px takeaway/notation footer. Do not shrink the whole figure.
- 'The local section has a 26 px heading, 6 px gap, and two 178 px tables side by side: dot width 306 px and addition
  width 150 px, separated by 12 px. Put titles into pale colored table header bands; use 16 px bold local table
  titles to fit the narrow addition table.'
- Tables use tensor rows and axis-group columns. Each has a 26 px title band, 26 px column-header row, and 42 px
  data rows. Use subtle horizontal separators with no internal vertical grid. Keep a thin neutral outer outline.
- Use 22 px section headings, 18 px symbolic cell expressions, 16 px muted gray examples, and at least 16 px throughout.
  Symbolic expressions sit above concrete zero-based examples. Slash in the content below separates these two lines,
  not division; a dash means the group is absent.
- Give the T row in both local tables a very pale scope-colored fill to identify the shared tensor. Connect the
  nested scopes to their local tables with short colored links routed through blank space beside the local heading.
- The shared table occupies the full 468 px inner width. Its header reads Shared mapping, with S = I ++ J beside
  it. Bold and pale-green-highlight only the newly derived I/J cells in rows Z and O, including their examples.
  Preserve the other entries with neutral styling.
- Keep the semantic expression and all original mapping formulas. Remove only its duplicate rendering, use compact
  notation, and preserve the takeaway about algebraic rewriting.
