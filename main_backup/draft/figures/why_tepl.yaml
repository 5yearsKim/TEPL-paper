authoring_reference:
  algebraic_term: "(dot (dot X Y) Z)\n=> (dot X\n     (dot Y Z))"
  custom_logic: "match_nested_dots\n(graph);\ncheck_conditions\n(metadata);\ninner_dims =\ncompute_inner_dims\n\
    (metadata);\nfinal_dims =\ncompute_final_dims\n(metadata);\nU = build_dot\n(Y, Z,\n inner_dims);\nreturn build_dot\n\
    (X, U,\n final_dims);"
  tepl_explicit: "(dot[@outer]\n  (dot[@inner]\n    X Y)\n  Z)\n=> (dot[@d_final]\n      X\n      (dot[@d_U]\n \
    \       Y Z))\nderive {\n  @d_U =\n  f_U\n(source_metadata);\n  @d_final =\n  f_final\n(source_metadata);\n}"
  tepl_inferred: "(dot (dot X Y) Z)\n=> (dot[auto] X\n     (dot[auto]\n       Y Z))"
