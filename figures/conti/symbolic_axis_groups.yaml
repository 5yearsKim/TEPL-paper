title: Symbolic axis groups
concept: Ordered, arbitrary-length axis groups bind to concrete tensor positions; binding order determines pairing
  and output construction.
purpose: Show why TEPL retains ordered position mappings, including when paired axes appear in different physical
  orders.
requirements:
- 'Apply the shared axis-group UI in tools/figure_style.md: canonical chips for concrete axes and table group labels,
  inline group colors in the flat legend and expressions, and editable underscore notation. Use the requested compact
  frame below.'
- Use an exact 500 × 500 px half-width frame with 12 px margins and 6 px gaps between the three main sections.
- Stack three full-width sections for symbolic groups, one concrete binding, and output construction.
- Use 22 px headings with 26 px line height, 18 px prose/table expressions with 22 px line height, and 16 px compact
  axis chips and position annotations with 20 px line height. Keep text editable; do not scale down the whole figure.
- Color B and b_a/b_b/b blue (#5479A8), I and i0/i1 green (#6A9F88), K and k0/k1 amber (#D4A65C), and J and j0/j1/j2
  purple (#9076AD).
- Carry the four group colors through the flat role legend, concrete axis cells, mapping table labels, and output.
- Use pale fills and dark text; retain group letters and role labels for grayscale readability.
- Use commas, plus signs, or line breaks as separators; do not use middle dots.
- Ellipses indicate variable group length; the concrete axes below are one instance, not fixed group arities.
- Preserve physical operand order in the axis strips; grouping and binding do not transpose or flatten tensors.
- Pair selected axes in binding-list order, not by sorted positions or dimension sizes.
- Pair b_a with b_b as the same batch coordinate b; equal k labels identify paired contraction coordinates.
- Keep the example local to one dot operation; composition and partitioning belong in separate figures.
- Replace the four role cards and miniature example strips with one flat row of unboxed role labels. Retain the
  arbitrary-length statement directly below it.
- Use 64 × 24 px concrete axis cells and place compact position numbers immediately underneath, without a gap. Use
  the same axis-cell size in the output.
- Use a 28 px header and four 28 px mapping-table rows, retaining 24 px group chips and the highlighted K row with
  bold position lists.
- Keep the batch-sharing sentence and ordered K-pairing explanation inside the figure. Put the position convention
  in caption_note rather than a separate figure line.
- Place the output-order heading and Reduced over K on one shared line; put the concrete output strip beneath it.
  Omit the extra divider and separate reduction row.
