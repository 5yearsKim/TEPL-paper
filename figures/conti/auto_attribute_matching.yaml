title: 'Attribute synthesis: from rules to attributes'
concept: Lower a distribution rule to Axes IR, normalize source semantics and the RHS arithmetic skeleton, then
  match operand reads, reuse their coordinates, and query symbolic axis positions to construct both missing descriptors.
purpose: Introduce the compilation procedure and its intermediate representations, while distinguishing coordinate
  correspondence from verification of the completed rewrite.
requirements:
- 'Apply the shared axis-group UI in tools/figure_style.md: canonical bordered chips, inline group colors, underscore notation, and contextual dimming. Preserve this figure''s content and frame dimensions.'
- Follow tools/figure_style.md. Use an exact 1000 × 500 px editable frame, maxWidth 1000, with 16 px outer margins.
  Use a 72 px input band, 294 px procedure band, and 78 px result band, separated by 12 px gaps.
- The procedure has 284 px Axes IR, 284 px Normalized terms, and 352 px Attribute matching panels, separated by
  two 24 px arrow gutters. Use auto-layout for related content, 22 px stage headings, 18 px rule and step labels,
  and at least 16 px dense formulas and explanations.
- Use elementwise add without broadcasting, unbatched generalized dot, and arithmetic permitting distribution. Add
  preserves paired operand axis order, so both inferred dot descriptors equal the source descriptor in this example.
- Use blue (#5479A8) for representations, amber (#D4A65C) for unresolved attribute holes and unknown groups, and green
  (#6A9F88) for constructed attributes and verification. Use pale fills with dark readable text; keep tensor identities
  explicit.
- I, J, and K denote ordered logical axis groups. A[I,K], B[I,K], and C[K,J] abbreviate indexed reads in group coordinates;
  they do not assert contiguous groups in physical tensor layouts. I_T denotes the ordered interface of tensor T.
- The reusable operation definitions feed semantic lowering and composition. Preserve source and RHS labels in both
  the Axes IR and normalized representations.
- Normalize the RHS arithmetic skeleton before its attributes are available. Write ? for unresolved axis information,
  never [] for unknown reductions. RHS terms remain templates, not complete normalized value expressions.
- Show read cards for both matched term pairs. Within each pair connect source A to RHS A, source B to RHS B, and
  each source C occurrence to its corresponding RHS C with dashed coordinate-transfer connectors. Retain multiplicities
  and tensor identities.
- Keep the two omitted RHS attribute records as separate synthesis unknowns. The result gives left.attrs = d.attrs and right.attrs = d.attrs because the elementwise addition
  preserves axis order. Symbolic mapping queries select K in each original input and construct contraction fields;
  they are not a separate full mapping-construction algorithm.
- Matching supplies coordinate correspondence and candidate attributes. Verify operation legality, values, and ordered
  outputs only after attributes have been filled. Show synthesis at rule compilation, not runtime inference.
