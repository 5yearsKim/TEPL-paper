title: Automatic Attribute Inference
concept: The compiler synthesizes omitted RHS attributes as an attribute function; each runtime match supplies captured metadata to f(p) and receives replacement dot attributes.
purpose: Introduce compile-time function generation and runtime application through transpose absorption into dot.
requirements:
- Apply tools/figure_style.md for editable text, literal underscore notation, neutral tensor edges, and the figure's
  declared user-input and compiler colors. Preserve the example and use the requested compact frame below.
- Use an exact 500 × 650 px half-width frame with 16 px outer margins and a 468 px content width.
- Stack user inputs, an enclosing TEPL compiler, and runtime application vertically.
- Use 22 px headings and 18 px code and primary labels; the compact inference-by-omission annotation may use 16 px. Keep
  all text editable and reflow the layout without scaling it.
- Use blue for user-input cards and operation semantics, green for the inference request, the generated function, its runtime application,
  and generated attributes.
- 'In both the user rule and completed replacement syntax, highlight only dot and transpose operation tokens in green (#6A9F88), matching the inference theme. Keep node names, tensor inputs, punctuation, and rewrite arrows neutral.'
- Use pale fills, dark text, neutral tensor edges, and solid information-flow arrows.
- Use commas, plus signs, or line breaks as separators; do not use middle dots.
- Use a matrix-dot example with rank-2 inputs and no batch axes; absorbing a transpose preserves the order of the
  single free axis from each operand.
- 'p denotes all source metadata: shapes and captured attributes. The transpose permutation π and dot descriptor δ are parts of this metadata.'
- The function signature is explanatory notation, not a user-written derive clause or a complete function body.
- Synthesis and verification happen inside the compiler; runtime applies the exported function.
- Concrete numbers appear only at runtime; show only the changing left contraction axis, keeping the other dot fields
  implicit.
- For the runtime instance use A of shape [m, k], B of shape [k, n], π = [1, 0], and δ with left and right contraction
  axes both 0.
- The result has left contraction axis 1 and unchanged right contraction axis 0; both graphs produce shape [m, n].
- Use a 342 px compile-time band, an 18 px phase divider, and a 258 px runtime band. Use 8 px gaps within the phase
  bands.
- Put Compile time and Generated once per rule on one 26 px header row. Put Runtime and Evaluate on each match on
  another shared header row, with the frequency notes right aligned.
- Use 128 px source cards and one 156 px compiler enclosure. Combine TEPL compiler and Synthesize + verify on its
  header row; retain a short downward dependency into the generated-function card.
- Use a 104 px generated-function card with just its heading, the function signature, and a single combined parameter-definition
  line. Keep this entire card inside the compiler enclosure.
- 'Keep the explicit runtime flow prominent: 160 px captured-input card, 20 px arrow gap, 108 px function-application
  card, 20 px arrow gap, and 160 px result card. Each card is 88 px tall.'
- Use a compact 160 × 98 px replacement graph beside its explanation. Keep tensor edges on the outer sides of the
  central descriptor badge, with no crossings.
- Replace the two bottom notation lines with the single explanatory sentence Only the left contraction axis is shown.
