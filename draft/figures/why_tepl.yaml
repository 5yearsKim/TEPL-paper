authoring_reference:
  algebraic_term: |-
    (dot (dot X Y) Z)
    => (dot X
         (dot Y Z))
  custom_logic: |-
    match_nested_dots
    (graph);
    check_conditions
    (metadata);
    inner_dims =
    compute_inner_dims
    (metadata);
    final_dims =
    compute_final_dims
    (metadata);
    U = build_dot
    (Y, Z,
     inner_dims);
    return build_dot
    (X, U,
     final_dims);
  tepl_explicit: |-
    (dot[@outer]
      (dot[@inner]
        X Y)
      Z)
    => (dot[@d_final]
          X
          (dot[@d_U]
            Y Z))
    derive {
      @d_U =
      f_U
    (source_metadata);
      @d_final =
      f_final
    (source_metadata);
    }
  tepl_inferred: |-
    (dot (dot X Y) Z)
    => (dot[auto] X
         (dot[auto]
           Y Z))
