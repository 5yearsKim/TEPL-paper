title: Why TEPL? From Algebraic Rules to Practical Tensor Rewrites
concept: Compare a bare algebraic pattern, custom rewrite logic, and TEPL's explicit and inferred attribute modes
  using the same replacement graph and visible attribute badges.
purpose: Show that TEPL retains concise algebraic rules while supplying the attribute handling required to implement
  tensor rewrites.
requirements:
- 'Apply the shared UI in tools/figure_style.md: canonical chips when applicable, editable underscore notation,
  and contextual dimming. Preserve this figure''s content and use the frame dimensions below.'
- Follow tools/figure_style.md; use an exact 1000 × 700 px frame, with four equal 230 px panels in one horizontal
  row beneath the shared rewriting rule. Use 16 px side margins, 12 px top/bottom margins, and a 10 px gap after
  the 60 px header.
- Use 22 px family headings, 18 px panel labels and primary rules, and 16 px minimum for dense host/derive code
  and graph labels. Emphasize the two aligned bottom checkpoints in 20 px bold text with 24 px line height. Restore
  the full matching, dimension-mapping, RHS-construction, and explicit-derive steps; abbreviate graph as g.
- Use generalized-dot reassociation without batch axes, under arithmetic permitting reassociation. All four panels
  describe the same rewrite; authoring code is schematic.
- Amber (#D4A65C) denotes author-written attributes and dimension logic. Green (#6A9F88) denotes inferred attributes.
  Neutral badges with question marks denote unspecified attributes.
- Highlight only dot operation tokens, using each panel's theme on both the LHS and RHS. Use blue (#5479A8) in panels (a) and (c), and green (#6A9F88) in inferred panel (d). Match graph operation tokens to their TEPL panel's color. Keep node labels, operands, punctuation, and rewrite arrows neutral. Attribute expressions, badges, and compiler outputs retain their manual/inferred colors; the shared header equation stays neutral.
- Number dots in computation order: d1 and d2 are the source dots; d3 and d4 are the replacement intermediate and result. Panel (c) names these operations in code; both TEPL graphs use d3:dot and d4:dot. The inferred rule needs no explicit node names.
- Group the left pair under Traditional approaches with blue (#5479A8) labels and a pale blue background; group
  the right pair under TEPL with green labels and a pale green background. Put one solid right arrow in the central
  family gutter.
- Give every panel equal heading, authoring-summary, attribute-flow, replacement-graph, and checkpoint regions.
  Preserve identical RHS graph and badge positions.
- 'Repeat a compact RHS graph: Y and Z feed U:dot, then X and U feed O′:dot. Each dot has one descriptor badge above
  it; tensor edges remain neutral.'
- Panels (a) and (d) use identical rule text; distinguish a bare pattern from a TEPL rule through explicit panel labels, operation semantics, and compiler flow.
- Panel (a) has question-mark badges. Panels (b) and (c) feed amber author-written results directly into their badges.
  Panel (d) feeds a reusable-operation-semantics card into a green TEPL compiler, then feeds both inferred outputs
  into its badges.
- In schematic host code, g denotes the graph; helpers read the matched attributes from g. Preserve compute_inner_dims, compute_final_dims,
  and both build_dot calls, using labeled regions for author responsibilities. These functions are user-written
  dimension logic, not TEPL inference builtins.
- The two omitted RHS attribute records are separate synthesis unknowns; show that each is inferred from source shapes and attributes.
  Place a Reusable operation semantics card below the rule and feed it into the TEPL compiler.
- 'Checkpoints summarize this example: the cross in (a) means the bare pattern leaves RHS attributes unspecified,
  not that symbolic rewriting systems cannot represent attributes.'
- Use matching red (#B84A48) callouts immediately above the replacement graphs in panels (a) and (b). Use 16 px
  bold callout titles and 18 px red consequence text. Red describes missing information or authoring burden; keep
  attribute expressions and manual output badges amber.
- In panel (a), outline the question-mark badges in red and connect the missing-attributes callout to both badges.
  In panel (b), mark the dimension-mapping region with a red bracket, associating it with the complexity callout;
  preserve all code.
- Use 20 px bold checkpoint labels and check/cross glyphs, with 18 px bold Manual/Automatic status words to fit
  the panel width. Use text check/cross glyphs rather than emoji. In the bottom checkpoint rows, color supported
  concise rules green and missing features red; color manual attribute support amber and automatic attribute support
  green. Use pale corresponding row fills and keep explicit status words for grayscale readability.
- 'Place the schematic-code legend g: graph at the top right beside the preserved shared example.'
- 'Preserve the user-edited header hierarchy: the reassociation equation comes first in 24 px bold monospace with
  30 px line height; put the explanatory sentence below in 16 px regular information text with 24 px line height
  and a 6 px gap.'
- 'Use 560 px-tall panels with 8 px vertical padding and 4 px gaps between aligned regions: heading 22 px, authoring
  300 px, attribute handling 52 px, replacement graph 88 px, and checkpoints 64 px. Use 6 px vertical family padding
  and separate family labels from panels by 6 px.'
- Add 12 px between the custom-code responsibility sections and 4 px between each section label and its code. Preserve
  all matching, dimension mapping, construction, and derive statements; use deliberate wrapping without shrinking
  fonts.
- 'Give every replacement graph the same compact layout: badges at y=8 px, Y and X labels at y=38 px, Z at y=54
  px, and dot boxes at y=52 px within its graph region. Leave 20 px between badge bottoms and operation tops; regenerate
  tensor and provenance connectors for the compact layout.'
- Use two 28 px checkpoint rows separated by 8 px. Center their text vertically with 2 px top and bottom padding,
  retaining existing font sizes, semantic colors, and explicit Manual/Automatic words.
- Keep all text editable and use commas, slashes, colons, or line breaks as separators; do not use middle dots.
- Use 3 px vertical padding and a 4 px gap inside the 52 px callout/compiler cards; retain all authoring-region
  content and font sizes.
