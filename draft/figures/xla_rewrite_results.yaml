title: XLA rewrite case results
concept: A left-to-right tree partitions 209 XLA rewrite cases by semantic support, RHS axis fields, and evaluation
  outcome.
purpose: Show semantic coverage and distinguish successful structural theorem candidates from unresolved cases and
  verification-only results.
requirements:
- Match the current editable Figma frame at https://www.figma.com/design/YQJMjTL8UuRL05QHkQr1Ge/TEPL?node-id=150-2.
  This storyboard corresponds to figures/XLA rewrite case results.pdf.
- Use an exact 500 × 380 px white frame. The title is metadata only. Preserve all node labels and parenthesized
  percentages.
- Arrange four columns from left to right. Connect root to supported and unsupported; supported to axis_fields and
  no_axis_fields; axis_fields to candidates and outside_scope; no_axis_fields to verified and unresolved.
- Use thin neutral orthogonal branches (#A7B2BB, 1.3 px), with shared vertical stems in the gaps between columns.
  Branches join node edges and indicate disjoint subsets, not execution order. Every outcome is a separate leaf;
  never connect an outcome through another outcome.
- Use a bordered card for every node, with 5 px corners and 0.8 px outlines. Keep flat fills, no shadows, and no
  gradients. Card and connector widths do not encode quantities.
- Center all text horizontally and center each text stack vertically. Use editable Arimo text; counts are bold 26
  px with 29 px line height, labels are regular 16 px with 18 px line height, and percentages are bold 16 px with
  18 px line height. Use 2 px stack gaps and at least 4 px vertical and 6 px horizontal padding. Wrap labels within
  the available width without clipping.
- 'Use neutral cards for root and unsupported (fill #F3F5F7, border #CBD4DB, count #52616B); blue for supported
  and both axis categories (fill #ECF2F8, border #9CB5D0, count #3F608A); green for candidates and verified (fill
  #EEF5F1, border #9CC2AF, count #396F59); amber for outside_scope and unresolved (fill #FBF4E7, border #DDC28F,
  count #9A702B). Labels remain dark #263238; percentages use the count color.'
- 'Percentages use immediate parent populations: 123/209 = 58.9%, 31/38 = 81.6%, and 67/85 = 78.8%. Display every
  percentage in parentheses on its own line.'
- Structural theorem candidate is a classification; theorem guarantees additionally require the stated assumptions.
  Unresolved does not establish impossibility or incorrectness.
