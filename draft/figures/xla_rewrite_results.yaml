title: XLA rewrite case results
concept: A top-to-bottom tree separates semantic coverage, RHS attribute-inference needs, and inference results inside and beyond the completeness-theorem fragment.
purpose: Show the scope of semantic support and distinguish guaranteed inference within the theorem fragment from empirical success beyond it.
requirements:
  - Target a half-width frame of 500 × 400 px with a white background; the title is metadata only.
  - Follow tools/figure_style.md. Use Arial-compatible text, dark text '#263238', flat cards, thin borders, and 4 px corner radii.
  - Use 22 px bold for the root count, 18 px primary labels, and 16 px result annotations with at least 20 px line height. Preserve these font sizes while tightening the layout.
  - Use the supplied counts as the source for this figure; the evaluation prose currently contains older counts.
  - Arrange four horizontal levels with downward branching connectors. Reserve 22 px between levels for connectors; put the root and aggregate result annotations on single lines.
  - Solid neutral arrows mean subset classification, not execution order or a causal relationship. Route branches orthogonally through the gaps with no crossings or text intersections.
  - 'Connect root → supported and unsupported; supported → attribute_free and rhs_inference; rhs_inference → within_fragment and beyond_fragment.'
  - Treat explicitly proved and successfully inferred as annotations inside their parent cards, not additional disjoint branches. Do not imply that the 94 explicitly proved cases and the 36 inferred cases are disjoint.
  - Keep attribute_free and unsupported as terminal branches. Do not infer a proof-rate breakdown for attribute_free or for either theorem-fragment branch.
  - Use pale blue '#ECF2F8' and blue borders '#5479A8' for supported and rhs_inference. Use neutral fill '#F3F5F7' and border '#DCE2E7' for root, unsupported, attribute_free, and beyond_fragment.
  - Highlight within_fragment with pale green '#EEF5F1' and a green border '#6A9F88'. Use dark green '#396F59' for successful inference annotations and dark amber '#9A702B' for unresolved; retain explicit text labels so color is supplementary.
  - Place the completeness-guarantee annotation only inside within_fragment. Beyond-fragment success is empirical; unresolved does not mean impossible or semantically invalid.
  - Counts and percentages are textual labels; card widths and connector widths do not encode quantities. Percentages use each stated parent population and round to one decimal, except 100%.
  - Keep 8 px card padding, with 4 px vertical padding in the root and bottom cards. Bottom cards retain 11 px horizontal padding. Bold each case count and keep explanatory text regular. Result annotations use 16 px; primary category labels use 18 px.

